<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept I — The Vessel Register — Galapagos Shark Diving</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Design concept prototype: a charter-brokerage treatment of the two vessels behind Galapagos Shark Diving expeditions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
html,body{margin:0;padding:0;background:#0B1A2A;}

.ci-root{
  --ci-navy:#0B1A2A;
  --ci-deep:#06101C;
  --ci-mid:#12283D;
  --ci-line:rgba(201,174,124,.24);
  --ci-line-soft:rgba(201,174,124,.13);
  --ci-brass:#A8874E;
  --ci-brass-lt:#C9AE7C;
  --ci-ivory:#F1ECE2;
  --ci-canvas:#FAF7F1;
  --ci-ink:#111C26;
  --ci-slate:#7D8FA0;
  --ci-slate-dk:#5C6E7E;
  --ci-teak:#4A3A28;
  --ci-max:1240px;
  background:var(--ci-navy);
  color:var(--ci-ivory);
  font-family:'Jost',system-ui,-apple-system,sans-serif;
  font-weight:300;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.ci-root *,.ci-root *::before,.ci-root *::after{box-sizing:border-box;}
.ci-root img{display:block;width:100%;height:100%;object-fit:cover;}
.ci-root h1,.ci-root h2,.ci-root h3{margin:0;font-weight:400;}
.ci-root p{margin:0;}
.ci-root ul,.ci-root ol,.ci-root dl{margin:0;padding:0;list-style:none;}
.ci-root a{color:inherit;text-decoration:none;}

.ci-display{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:300;
  font-size:clamp(2.4rem,5.2vw,4.4rem);
  line-height:1.02;
  letter-spacing:-.012em;
}
.ci-display-sm{font-size:clamp(1.9rem,3.4vw,2.9rem);}
.ci-eyebrow{
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ci-brass-lt);font-weight:500;margin-bottom:1.1rem;
}
.ci-lede{font-size:1.06rem;line-height:1.62;color:rgba(241,236,226,.82);max-width:56ch;}
.ci-p{font-size:.97rem;line-height:1.68;color:rgba(241,236,226,.74);max-width:62ch;}
.ci-fine{font-size:.8rem;line-height:1.6;color:var(--ci-slate);max-width:60ch;}
.ci-kicker{
  font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ci-brass-lt);font-weight:500;
}

/* masthead */
.ci-mast{
  position:relative;z-index:20;
  border-bottom:1px solid var(--ci-line);
  background:var(--ci-deep);
}
.ci-mast-in{
  max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:flex;align-items:center;gap:28px;min-height:76px;
}
.ci-mast-mark{display:flex;flex-direction:column;line-height:1.1;}
.ci-mast-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.22rem;letter-spacing:.01em;}
.ci-mast-sub{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ci-brass);margin-top:3px;}
.ci-mast-nav{margin-left:auto;display:flex;gap:26px;}
.ci-mast-nav a{
  font-size:.76rem;letter-spacing:.09em;color:rgba(241,236,226,.66);
  padding-bottom:2px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;
}
.ci-mast-nav a:hover,.ci-mast-nav a:focus-visible{color:var(--ci-ivory);border-color:var(--ci-brass);}
.ci-mast-cta{
  font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--ci-brass);color:var(--ci-brass-lt);
  padding:9px 18px;transition:background .2s,color .2s;
}
.ci-mast-cta:hover,.ci-mast-cta:focus-visible{background:var(--ci-brass);color:var(--ci-deep);}

/* opening */
.ci-open{position:relative;overflow:hidden;background:var(--ci-deep);}
.ci-open-plate{position:absolute;inset:0;}
.ci-open-plate::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(6,16,28,.96) 0%,rgba(6,16,28,.9) 42%,rgba(11,26,42,.72) 100%);
}
.ci-open-plate img{opacity:.42;filter:saturate(.62);}
.ci-open-in{
  position:relative;max-width:var(--ci-max);margin:0 auto;
  padding:86px 28px 78px;
}
.ci-open-h{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;
  font-size:clamp(2.6rem,6.2vw,5.3rem);line-height:.99;letter-spacing:-.016em;
  margin:1.4rem 0 1.5rem;max-width:20ch;
}
.ci-open-p{font-size:1.02rem;line-height:1.66;color:rgba(241,236,226,.76);max-width:60ch;}

/* fleet gate */
.ci-gate{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:56px;background:var(--ci-line-soft);}
.ci-gate-card{
  appearance:none;border:0;margin:0;text-align:left;cursor:pointer;
  font:inherit;color:inherit;
  background:rgba(6,16,28,.72);
  padding:0;display:block;position:relative;
  transition:background .3s ease;
}
.ci-gate-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:1px solid transparent;transition:border-color .3s ease;
}
.ci-gate-card:hover{background:rgba(18,40,61,.82);}
.ci-gate-card.is-on{background:rgba(18,40,61,.95);}
.ci-gate-card.is-on::after{border-color:var(--ci-brass);}
.ci-gate-card:focus-visible{outline:2px solid var(--ci-brass-lt);outline-offset:-2px;}
.ci-gate-img{display:block;height:216px;overflow:hidden;position:relative;}
.ci-gate-img img{transition:transform .8s cubic-bezier(.2,.7,.2,1);filter:saturate(.82);}
.ci-gate-card:hover .ci-gate-img img{transform:scale(1.035);}
.ci-gate-card.is-on .ci-gate-img img{filter:saturate(1);}
.ci-gate-body{display:block;padding:26px 28px 28px;}
.ci-gate-name{
  display:block;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:2.05rem;line-height:1.05;letter-spacing:-.008em;
}
.ci-gate-suffix{
  display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ci-brass);margin-top:8px;
}
.ci-gate-specs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  margin:22px 0 20px;border-top:1px solid var(--ci-line-soft);
  border-bottom:1px solid var(--ci-line-soft);padding:14px 0;
}
.ci-gate-spec{display:block;}
.ci-gate-spec-v{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;line-height:1;}
.ci-gate-spec-l{
  display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ci-slate);margin-top:6px;
}
.ci-gate-act{
  display:block;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ci-brass-lt);
}
.ci-gate-card.is-on .ci-gate-act{color:var(--ci-ivory);}

/* sticky bar */
.ci-bar{
  position:sticky;top:0;z-index:15;
  background:rgba(6,16,28,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--ci-line);border-bottom:1px solid var(--ci-line);
}
.ci-bar-in{
  max-width:var(--ci-max);margin:0 auto;padding:12px 28px;
  display:flex;align-items:center;gap:14px;
}
.ci-bar-label{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ci-slate);}
.ci-bar-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.28rem;}
.ci-bar-sep{width:1px;height:16px;background:var(--ci-line);}
.ci-bar-prog{font-size:.76rem;letter-spacing:.1em;color:var(--ci-brass-lt);}
.ci-bar-swap{
  margin-left:auto;appearance:none;background:none;cursor:pointer;font:inherit;
  border:1px solid var(--ci-line);color:rgba(241,236,226,.8);
  font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;padding:8px 15px;
  transition:border-color .2s,color .2s;
}
.ci-bar-swap:hover,.ci-bar-swap:focus-visible{border-color:var(--ci-brass);color:var(--ci-brass-lt);}

/* specification */
.ci-spec{background:var(--ci-navy);padding:92px 0 0;}
.ci-spec-in{
  max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:64px;align-items:start;
}
.ci-spec-suffix{
  font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ci-brass);margin:14px 0 22px;
}
.ci-spec .ci-lede{margin-bottom:28px;}
.ci-from{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.ci-from-l{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ci-slate);}
.ci-from-v{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.1rem;line-height:1;}
.ci-from-u{font-size:.8rem;color:var(--ci-slate);}
.ci-btn{
  display:inline-block;margin-top:26px;
  border:1px solid var(--ci-brass);color:var(--ci-brass-lt);
  font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;
  padding:14px 28px;transition:background .25s,color .25s;
}
.ci-btn:hover,.ci-btn:focus-visible{background:var(--ci-brass);color:var(--ci-deep);}
.ci-btn-full{display:block;width:100%;text-align:center;border:1px solid var(--ci-brass);
  background:var(--ci-brass);color:var(--ci-deep);cursor:pointer;font-family:inherit;margin-top:8px;}
.ci-btn-full:hover{background:var(--ci-brass-lt);}
.ci-spec-fig{margin:0;}
.ci-spec-fig img{aspect-ratio:4/3;}
.ci-spec-fig figcaption{
  margin-top:12px;font-size:.74rem;color:var(--ci-slate);
  border-top:1px solid var(--ci-line-soft);padding-top:10px;
}

.ci-tables{
  max-width:var(--ci-max);margin:76px auto 0;padding:0 28px 92px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ci-line-soft);
}
.ci-table{background:var(--ci-navy);padding:30px 26px 32px;}
.ci-th{
  font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ci-brass);margin-bottom:20px;font-weight:500;
}
.ci-dl-row{
  display:flex;align-items:baseline;gap:8px;
  padding:9px 0;border-bottom:1px dotted rgba(201,174,124,.2);
}
.ci-dl-row dt{font-size:.85rem;color:var(--ci-slate);flex:0 0 auto;}
.ci-dl-row dd{margin:0 0 0 auto;font-size:.9rem;text-align:right;color:var(--ci-ivory);}
.ci-ul li{
  position:relative;padding:8px 0 8px 18px;font-size:.88rem;
  color:rgba(241,236,226,.78);border-bottom:1px dotted rgba(201,174,124,.2);
}
.ci-ul li::before{
  content:"";position:absolute;left:0;top:16px;width:6px;height:1px;background:var(--ci-brass);
}
.ci-ul-lg li{font-size:.95rem;padding:11px 0 11px 20px;}
.ci-ul-lg li::before{top:20px;}

/* deck stack */
.ci-decks{background:var(--ci-deep);border-top:1px solid var(--ci-line);padding:88px 0;}
.ci-decks-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;align-items:start;}
.ci-decks-hd .ci-display{margin-bottom:18px;}
.ci-stack{display:flex;flex-direction:column;gap:1px;}
.ci-stack-deck{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;
  padding:16px 0;border-top:1px solid var(--ci-line-soft);}
.ci-stack-deck:first-child{border-top:1px solid var(--ci-line);}
.ci-stack-label{display:flex;flex-direction:column;}
.ci-stack-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.28rem;line-height:1.1;}
.ci-stack-note{font-size:.7rem;color:var(--ci-slate);margin-top:4px;line-height:1.4;}
.ci-stack-hull{
  display:flex;gap:6px;align-items:center;min-height:52px;
  background:linear-gradient(90deg,rgba(18,40,61,.9),rgba(18,40,61,.4));
  border:1px solid var(--ci-line-soft);padding:8px 12px;
}
.ci-stack-cab{
  flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
  height:36px;border:1px solid var(--ci-line);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;
  color:var(--ci-brass-lt);background:rgba(11,26,42,.7);
}
.ci-stack-cab.is-unconfirmed{
  border-style:dashed;color:var(--ci-slate);background:transparent;
}
.ci-stack-blank{
  flex:1 1 auto;height:36px;border:1px solid var(--ci-line-soft);
  background-image:repeating-linear-gradient(135deg,
    rgba(201,174,124,.16) 0 1px, transparent 1px 9px);
}
.ci-stack-keel{
  margin-top:8px;border-top:1px solid var(--ci-brass);padding-top:7px;
  display:grid;grid-template-columns:200px 1fr;gap:20px;
}
.ci-stack-keel span{
  grid-column:2;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ci-brass);
}

/* accommodation listing */
.ci-accom{background:var(--ci-canvas);color:var(--ci-ink);padding:92px 0;}
.ci-accom .ci-eyebrow{color:var(--ci-teak);}
.ci-accom .ci-p{color:#3E4C59;}
.ci-accom-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;}
.ci-accom-hd{max-width:62ch;margin-bottom:46px;}
.ci-accom-hd .ci-display{margin-bottom:16px;}
.ci-list-row{
  display:grid;grid-template-columns:168px 210px minmax(0,1fr) 160px;
  gap:28px;align-items:center;
  padding:22px 0;border-top:1px solid rgba(17,28,38,.14);
}
.ci-list-row:last-child{border-bottom:1px solid rgba(17,28,38,.14);}
.ci-list-img{height:120px;overflow:hidden;background:#DED7CA;}
.ci-list-img img{transition:transform .8s cubic-bezier(.2,.7,.2,1);}
.ci-list-row:hover .ci-list-img img{transform:scale(1.04);}
.ci-list-deck{font-size:.63rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ci-teak);}
.ci-list-ref{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.65rem;line-height:1.1;margin:5px 0 4px;}
.ci-list-berth{font-size:.84rem;color:#5A6875;}
.ci-list-note{font-size:.88rem;line-height:1.6;color:#3E4C59;}
.ci-list-act{text-align:right;}
.ci-list-act a{
  display:inline-block;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid rgba(74,58,40,.42);color:var(--ci-teak);padding:10px 15px;
  transition:background .2s,color .2s,border-color .2s;
}
.ci-list-act a:hover,.ci-list-act a:focus-visible{background:var(--ci-teak);color:var(--ci-canvas);border-color:var(--ci-teak);}

/* dive platform */
.ci-plat{background:var(--ci-navy);padding:92px 0;}
.ci-plat-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:60px;align-items:start;}
.ci-plat-copy .ci-display{margin-bottom:26px;}
.ci-nitrox{margin-top:30px;border-left:2px solid var(--ci-brass);padding:4px 0 4px 20px;}
.ci-nitrox-l{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ci-brass-lt);margin-bottom:8px;}
.ci-nitrox-p{font-size:.92rem;line-height:1.66;color:rgba(241,236,226,.78);max-width:56ch;}
.ci-plat-imgs{display:grid;gap:22px;}
.ci-plat-imgs figure{margin:0;}
.ci-plat-imgs img{aspect-ratio:16/10;filter:saturate(.88);}
.ci-plat-imgs figcaption{
  margin-top:10px;font-size:.72rem;color:var(--ci-slate);
  border-top:1px solid var(--ci-line-soft);padding-top:9px;
}

/* itinerary */
.ci-itin{background:var(--ci-deep);border-top:1px solid var(--ci-line);padding:88px 0;}
.ci-itin-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;}
.ci-itin-hd{max-width:64ch;margin-bottom:44px;}
.ci-itin-hd .ci-display{margin-bottom:16px;}
.ci-days{border-top:1px solid var(--ci-line);}
.ci-days li{
  display:grid;grid-template-columns:56px 160px minmax(0,1fr);gap:24px;align-items:baseline;
  padding:18px 0;border-bottom:1px solid var(--ci-line-soft);
}
.ci-days-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;color:var(--ci-brass);}
.ci-days-d{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ci-brass-lt);}
.ci-days-b{font-size:.95rem;line-height:1.62;color:rgba(241,236,226,.8);}
.ci-alloc{width:100%;border-collapse:collapse;text-align:left;}
.ci-alloc th,.ci-alloc td{padding:16px 14px;border-bottom:1px solid var(--ci-line-soft);font-weight:400;}
.ci-alloc thead th{
  font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ci-brass);
  border-bottom:1px solid var(--ci-brass);
}
.ci-alloc tbody th{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.25rem;}
.ci-alloc tbody td{font-size:.95rem;color:rgba(241,236,226,.8);}
.ci-alloc th:first-child,.ci-alloc td:first-child{padding-left:0;}

/* cruising grounds */
.ci-grounds{background:var(--ci-navy);padding:92px 0;}
.ci-grounds-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;}
.ci-grounds-hd{max-width:64ch;margin-bottom:52px;}
.ci-grounds-hd .ci-display{margin-bottom:18px;}
.ci-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--ci-line-soft);}
.ci-ground{background:var(--ci-navy);padding:0 0 30px;}
.ci-ground-img{height:262px;overflow:hidden;margin-bottom:24px;}
.ci-ground-img img{transition:transform 1s cubic-bezier(.2,.7,.2,1);filter:saturate(.9);}
.ci-ground:hover .ci-ground-img img{transform:scale(1.03);}
.ci-ground-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.85rem;line-height:1.08;padding:0 26px;}
.ci-ground-s{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ci-brass);padding:0 26px;margin:9px 0 14px;}
.ci-ground-b{font-size:.92rem;line-height:1.66;color:rgba(241,236,226,.74);padding:0 26px;}

/* science */
.ci-sci{background:var(--ci-deep);border-top:1px solid var(--ci-line);padding:88px 0;}
.ci-sci-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px;align-items:center;}
.ci-sci-fig{margin:0;}
.ci-sci-fig img{aspect-ratio:5/4;filter:saturate(.9);}
.ci-sci-copy .ci-display{margin-bottom:22px;}
.ci-sci-copy .ci-p{margin-bottom:16px;}

/* availability */
.ci-avail{background:var(--ci-canvas);color:var(--ci-ink);padding:92px 0;}
.ci-avail .ci-eyebrow{color:var(--ci-teak);}
.ci-avail .ci-p{color:#3E4C59;}
.ci-avail-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;}
.ci-avail-hd{max-width:62ch;margin-bottom:40px;}
.ci-avail-hd .ci-display{margin-bottom:16px;}
.ci-reg{width:100%;border-collapse:collapse;text-align:left;}
.ci-reg thead th{
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ci-teak);
  padding:0 14px 12px;border-bottom:1px solid rgba(74,58,40,.5);font-weight:500;
}
.ci-reg tbody th,.ci-reg tbody td{
  padding:16px 14px;border-bottom:1px solid rgba(17,28,38,.12);font-weight:400;font-size:.92rem;
}
.ci-reg tbody th{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;white-space:nowrap;}
.ci-reg th:first-child,.ci-reg td:first-child{padding-left:0;}
.ci-reg tbody tr.is-sel{background:rgba(168,135,78,.09);}
.ci-state{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;}
.ci-state-open{color:#1F5E3C;}
.ci-state-low{color:#7A5A16;}
.ci-state-closed{color:#7C6F63;}

/* enquiry */
.ci-enq{background:var(--ci-navy);padding:96px 0;border-top:1px solid var(--ci-line);}
.ci-enq-in{max-width:var(--ci-max);margin:0 auto;padding:0 28px;
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:64px;align-items:start;}
.ci-enq-copy .ci-display{margin:0 0 22px;}
.ci-enq-facts{margin-top:34px;border-top:1px solid var(--ci-line);}
.ci-enq-facts>div{padding:14px 0;border-bottom:1px solid var(--ci-line-soft);display:grid;
  grid-template-columns:130px minmax(0,1fr);gap:18px;}

    + '<div class="ci-mast-mark"><span class="ci-mast-name">Gal\u00e1pagos Shark Diving</span><span class="ci-mast-sub">Vessel register</span></div>'
    + '<nav class="ci-mast-nav" aria-label="Register sections"><a href="#ci-fleet">Fleet</a><a href="#ci-spec">Specification</a><a href="#ci-accom">Accommodation</a><a href="#ci-grounds">Cruising grounds</a><a href="#ci-avail">Availability</a></nav>'
    + '<a class="ci-mast-cta" href="#ci-enquire">Enquire</a></div></header>';

  h += '<section class="ci-open" id="ci-fleet">'
    + '<div class="ci-open-plate" aria-hidden="true"><img src="' + IMG.heroPlate + '" alt=""></div>'
    + '<div class="ci-open-in">'
    + '<p class="ci-kicker">Two vessels \u00b7 Darwin and Wolf \u00b7 sixteen guests each</p>'
    + '<h1 class="ci-open-h">Choose the hull<br>before you choose the week.</h1>'
    + '<p class="ci-open-p">Every Gal\u00e1pagos Shark Diving expedition is defined first by the vessel that carries it. Two are on the register. They are not interchangeable: different lengths, different speeds, different dive decks, different programmes, and different rules on enriched air. Begin with the boat.</p>'
    + '<div class="ci-gate">';
  VESSEL_ORDER.forEach(function(x){
    var on = x.key === activeKey;
    h += '<button type="button" class="ci-gate-card' + (on ? " is-on" : "") + '" aria-pressed="' + on + '" data-vessel="' + x.key + '">'
      + '<span class="ci-gate-img"><img src="' + x.exterior + '" alt="' + esc(x.exteriorAlt) + '" loading="lazy"></span>'
      + '<span class="ci-gate-body"><span class="ci-gate-name">' + esc(x.name) + '</span>'
      + '<span class="ci-gate-suffix">' + esc(x.suffix) + '</span><span class="ci-gate-specs">'
      + x.headline.map(function(p){return '<span class="ci-gate-spec"><span class="ci-gate-spec-v">' + esc(p[1]) + '</span><span class="ci-gate-spec-l">' + esc(p[0]) + '</span></span>';}).join("")
      + '</span><span class="ci-gate-act">' + (on ? "Selected \u2014 register below" : "Open this vessel\u2019s register") + '</span></span></button>';
  });
  h += '</div></div></section>';

  h += '<div class="ci-bar"><div class="ci-bar-in"><span class="ci-bar-label">Viewing</span>'
    + '<span class="ci-bar-name">' + esc(v.name) + '</span><span class="ci-bar-sep" aria-hidden="true"></span>'
    + '<span class="ci-bar-prog">' + esc(v.programme) + '</span>'
    + '<button type="button" class="ci-bar-swap" data-vessel="' + other.key + '">Switch to ' + esc(other.name) + '</button></div></div>';

  h += '<section class="ci-spec" id="ci-spec"><div class="ci-spec-in"><div class="ci-spec-hd">'
    + '<p class="ci-eyebrow">Vessel specification</p><h2 class="ci-display">' + esc(v.name) + '</h2>'
    + '<p class="ci-spec-suffix">' + esc(v.suffix) + '</p><p class="ci-lede">' + esc(v.standfirst) + '</p>'
    + '<p class="ci-from"><span class="ci-from-l">From</span><span class="ci-from-v">USD ' + esc(v.fromPrice) + '</span><span class="ci-from-u">per person</span></p>'
    + '<p class="ci-fine">' + esc(v.priceNote) + '</p>'
    + '<a class="ci-btn" href="#ci-enquire">Enquire about ' + esc(v.name) + '</a></div>'
    + '<figure class="ci-spec-fig"><img src="' + v.exterior + '" alt="' + esc(v.exteriorAlt) + '" loading="lazy"><figcaption>' + esc(v.exteriorAlt) + '</figcaption></figure></div>';

  h += '<div class="ci-tables"><div class="ci-table"><h3 class="ci-th">Principal particulars</h3><dl class="ci-dl">'
    + v.particulars.map(function(p){return '<div class="ci-dl-row"><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';}).join("")
    + '</dl></div><div class="ci-table"><h3 class="ci-th">Machinery and equipment</h3><dl class="ci-dl">'
    + v.machinery.map(function(p){return '<div class="ci-dl-row"><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';}).join("")
    + '</dl></div><div class="ci-table"><h3 class="ci-th">On board</h3><ul class="ci-ul">'
    + v.amenities.map(function(a){return '<li>' + esc(a) + '</li>';}).join("")
    + '</ul></div></div></section>';

  var deckCopy = v.key === "aqua"
    ? "Three guest decks over the dive platform. The vessel\u2019s own deck plans number every cabin 1 to 9 with none repeated or skipped: three forward on the lower deck, the Master alone on the main deck, five on the upper."
    : "Three guest decks over the dive deck, with the jacuzzi and the shaded 117 m\u00b2 area above. The upper and main decks are drawn as the operator\u2019s prose and its own deck plans both describe them, four cabins and three. The lower deck carries one confirmed cabin and one the two sources disagree about \u2014 drawn dashed, and confirmed in writing on enquiry rather than guessed at here.";

  h += '<section class="ci-decks"><div class="ci-decks-in"><div class="ci-decks-hd">'
    + '<p class="ci-eyebrow">Deck arrangement</p><h2 class="ci-display ci-display-sm">' + esc(v.name) + ' \u2014 deck stack</h2>'
    + '<p class="ci-p">' + deckCopy + '</p></div>'
    + '<div class="ci-stack" role="img" aria-label="Deck arrangement diagram for ' + esc(v.name) + '">';
  v.decks.forEach(function(d){
    h += '<div class="ci-stack-deck"><div class="ci-stack-label"><span class="ci-stack-name">' + esc(d.name) + '</span>'
      + '<span class="ci-stack-note">' + esc(d.note) + '</span></div><div class="ci-stack-hull">'
      + (d.cabins.length
        ? d.cabins.map(function(c){return '<span class="ci-stack-cab' + (c === "?" ? " is-unconfirmed" : "") + '">' + esc(c) + '</span>';}).join("")
        : '<span class="ci-stack-blank" aria-hidden="true"></span>')
      + '</div></div>';
  });
  h += '<div class="ci-stack-keel"><span>Waterline</span></div></div></div></section>';

  h += '<section class="ci-accom" id="ci-accom"><div class="ci-accom-in"><div class="ci-accom-hd">'
    + '<p class="ci-eyebrow">Accommodation</p><h2 class="ci-display ci-display-sm">Cabins aboard ' + esc(v.name) + '</h2>'
    + '<p class="ci-p">' + esc(v.cabinsIntro) + '</p></div><ol class="ci-list">'
    + v.cabins.map(function(c){
        return '<li class="ci-list-row"><div class="ci-list-img"><img src="' + c.img + '" alt="' + esc(c.alt) + '" loading="lazy"></div>'
          + '<div class="ci-list-meta"><p class="ci-list-deck">' + esc(c.deck) + '</p><h3 class="ci-list-ref">' + esc(c.ref) + '</h3>'
          + '<p class="ci-list-berth">' + esc(c.berth) + '</p></div><p class="ci-list-note">' + esc(c.note) + '</p>'
          + '<div class="ci-list-act"><a href="#ci-enquire">Request availability</a></div></li>';
      }).join("")
    + '</ol></div></section>';

  h += '<section class="ci-plat"><div class="ci-plat-in"><div class="ci-plat-copy">'
    + '<p class="ci-eyebrow">Dive platform</p><h2 class="ci-display ci-display-sm">Thirty-four tanks<br>and somewhere to put a camera down.</h2>'
    + '<ul class="ci-ul ci-ul-lg">' + v.platform.map(function(p){return '<li>' + esc(p) + '</li>';}).join("") + '</ul>'
    + '<div class="ci-nitrox"><p class="ci-nitrox-l">Enriched air on this vessel</p><p class="ci-nitrox-p">' + esc(v.nitrox) + '</p></div></div>'
    + '<div class="ci-plat-imgs">'
    + '<figure><img src="' + IMG.diveDeck + '" alt="Dive deck of the Aqua with several scuba tanks organised on benches, Gal\u00e1pagos" loading="lazy"><figcaption>Dive deck, tanks racked on benches</figcaption></figure>'
    + '<figure><img src="' + IMG.kittingUp + '" alt="Scuba divers kitting up for a Gal\u00e1pagos dive with wetsuits, tanks and dive gear on the Aqua" loading="lazy"><figcaption>Kitting up before a Darwin dive</figcaption></figure>'
    + '</div></div></section>';

  var itinCopy = v.itineraryKind === "days"
    ? "Sixteen dives across eight days by the operator\u2019s own per-stop counts. All itineraries fall under the jurisdiction of the Gal\u00e1pagos National Park and may change at short notice."
    : "Rather than a fixed day-by-day, the Citizen Science expeditions are published as a dive allocation across the cruising grounds \u2014 the eight-day and the fifteen-day side by side. All itineraries fall under the jurisdiction of the Gal\u00e1pagos National Park and may change at short notice.";

  h += '<section class="ci-itin"><div class="ci-itin-in"><div class="ci-itin-hd">'
    + '<p class="ci-eyebrow">Charter itinerary</p><h2 class="ci-display ci-display-sm">' + esc(v.itineraryTitle) + '</h2>'
    + '<p class="ci-p">' + itinCopy + '</p></div>';
  if (v.itineraryKind === "days") {
    h += '<ol class="ci-days">' + v.days.map(function(d, i){
      return '<li><span class="ci-days-n">' + String(i + 1).padStart(2, "0") + '</span><span class="ci-days-d">' + esc(d[0]) + '</span><span class="ci-days-b">' + esc(d[1]) + '</span></li>';
    }).join("") + '</ol>';
  } else {
    h += '<table class="ci-alloc"><thead><tr><th scope="col">Cruising ground</th><th scope="col">8-day expedition</th><th scope="col">15-day expedition</th></tr></thead><tbody>'
      + v.allocation.map(function(r){return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';}).join("")
      + '</tbody></table>';
  }
  h += '</div></section>';

  h += '<section class="ci-grounds" id="ci-grounds"><div class="ci-grounds-in"><div class="ci-grounds-hd">'
    + '<p class="ci-eyebrow">Cruising grounds</p><h2 class="ci-display">What this hull reaches.</h2>'
    + '<p class="ci-lede">Darwin and Wolf are seamounts three hundred kilometres north of the inhabited islands. No day boat gets there. The reason to read a specification sheet this closely is that the specification is what puts you in that water, on those sites, in whale shark season between June and November.</p></div>'
    + '<div class="ci-grid">'
    + GROUNDS.map(function(g){
        return '<article class="ci-ground"><div class="ci-ground-img"><img src="' + g.img + '" alt="' + esc(g.alt) + '" loading="lazy"></div>'
          + '<h3 class="ci-ground-n">' + esc(g.name) + '</h3><p class="ci-ground-s">' + esc(g.sub) + '</p><p class="ci-ground-b">' + esc(g.body) + '</p></article>';
      }).join("")
    + '</div></div></section>';

  h += '<section class="ci-sci"><div class="ci-sci-in">'
    + '<figure class="ci-sci-fig"><img src="' + IMG.tagging + '" alt="Research diver tagging an adult female whale shark in the Gal\u00e1pagos Islands" loading="lazy"></figure>'
    + '<div class="ci-sci-copy"><p class="ci-eyebrow">Aboard, on every departure</p>'
    + '<h2 class="ci-display ci-display-sm">A shark researcher is part of the manifest.</h2>'
    + '<p class="ci-p">Both programmes carry a shark researcher on board, with onboard presentations, and both are run in partnership with the Gal\u00e1pagos Whale Shark Project. Citizen science is not a bolt-on excursion here \u2014 it is one of the berths.</p>'
    + '<p class="ci-p">Included on every expedition: cabin, two to four dives a day, Gal\u00e1pagos airport transfers, all meals and snacks, tanks, weights and belts, bilingual dive masters, safety equipment and toiletries.</p>'
    + '<p class="ci-fine">Certification minimum: at least one dive within the prior six months, dive-accident insurance, and a dive computer. The vessel supplies tanks, weights and belts; divers bring mask, snorkel, fins, booties, BCD, regulator and a 3\u20137 mm wetsuit, or rent on board.</p></div></div></section>';

  h += '<section class="ci-avail" id="ci-avail"><div class="ci-avail-in"><div class="ci-avail-hd">'
    + '<p class="ci-eyebrow">Availability register</p><h2 class="ci-display ci-display-sm">2027 season, both hulls</h2>'
    + '<p class="ci-p">Berth counts as published. Solo travellers are matched with a same-sex cabin mate and pay the single-person price, with a private-cabin option available.</p></div>'
    + '<table class="ci-reg"><thead><tr><th scope="col">Dates</th><th scope="col">Vessel</th><th scope="col">Days</th><th scope="col">Berths</th><th scope="col">Status</th></tr></thead><tbody>'
    + AVAILABILITY.map(function(r){
        var label = r.state === "open" ? "Open" : (r.state === "low" ? "Limited berths" : "Fully booked");
        return '<tr class="' + (r.vessel === v.name ? "is-sel" : "") + '"><th scope="row">' + esc(r.dates) + '</th><td>' + esc(r.vessel) + '</td><td>' + esc(r.days) + '</td><td>' + esc(r.berths) + '</td><td><span class="ci-state ci-state-' + r.state + '">' + label + '</span></td></tr>';
      }).join("")
    + '</tbody></table></div></section>';

  h += '<section class="ci-enq" id="ci-enquire"><div class="ci-enq-in"><div class="ci-enq-copy">'
    + '<p class="ci-eyebrow">Broker enquiry</p><h2 class="ci-display">Enquire about<br>' + esc(v.name) + '.</h2>'
    + '<p class="ci-lede">Tell us the hull and the window. We will come back with the berths actually available, the cabin on the deck you asked for, the scientist sailing that week, and the written confirmation of anything on this register you want stood behind.</p>'
    + '<dl class="ci-enq-facts">'
    + '<div><dt>WhatsApp</dt><dd>+593 999 66 7219</dd></div>'
    + '<div><dt>Boarding</dt><dd>Baltra no later than 10:30 \u00b7 departure no earlier than 12:00</dd></div>'
    + '<div><dt>Season</dt><dd>Whale shark season June \u2013 November</dd></div>'
    + '</dl></div>'
    + '<form class="ci-form" id="ci-form"><p class="ci-form-h">Request availability</p>'
    + '<div class="ci-field"><label for="ci-vessel">Vessel</label><select id="ci-vessel">'
    + '<option value="aqua"' + (activeKey === "aqua" ? " selected" : "") + '>Aqua \u2014 Citizen Science</option>'
    + '<option value="galaxy"' + (activeKey === "galaxy" ? " selected" : "") + '>Galaxy Diver II \u2014 Luxury Citizen Science</option>'
    + '</select></div>'
    + '<div class="ci-field"><label for="ci-name">Name</label><input id="ci-name" type="text" autocomplete="name"></div>'
    + '<div class="ci-field"><label for="ci-email">Email</label><input id="ci-email" type="email" autocomplete="email"></div>'
    + '<div class="ci-field"><label for="ci-window">Preferred window</label><input id="ci-window" type="text" placeholder="e.g. August 2027"></div>'
    + '<div class="ci-field"><label for="ci-notes">Cabin preference or questions</label><textarea id="ci-notes" rows="3"></textarea></div>'
    + '<button type="submit" class="ci-btn ci-btn-full">Enquire about this vessel</button>'
    + '<p class="ci-form-fine">Prototype form \u2014 nothing is submitted. A real enquiry goes to the team on WhatsApp.</p></form></div></section>';

  h += '<footer class="ci-foot"><div class="ci-foot-in"><p>Gal\u00e1pagos Shark Diving\u00ae \u2014 vessel register, design concept I.</p>'
    + '<p class="ci-foot-note">Specifications as published by the operator and its vessels. Galaxy Diver II\u2019s cabin count is unresolved in the source material and is deliberately not stated. Itineraries fall under the jurisdiction of the Gal\u00e1pagos National Park.</p></div></footer>';

  var root = document.getElementById("ci-root");
  root.innerHTML = h;

  root.querySelectorAll("[data-vessel]").forEach(function(el){
    el.addEventListener("click", function(){
      var y = window.scrollY;
      activeKey = el.getAttribute("data-vessel");
      render();
      window.scrollTo(0, y);
    });
  });
  var sel = document.getElementById("ci-vessel");
  if (sel) sel.addEventListener("change", function(){
    var y = window.scrollY; activeKey = sel.value; render(); window.scrollTo(0, y);
  });
  var form = document.getElementById("ci-form");
  if (form) form.addEventListener("submit", function(e){ e.preventDefault(); });
}

render();
</script>
